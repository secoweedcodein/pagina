spring.application.name=webia-supabase
server.port=${SERVER_PORT:8080}
spring.profiles.default=${APP_PROFILE:local}

spring.thymeleaf.cache=false
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8

spring.servlet.multipart.max-file-size=${MAX_FILE_SIZE_MB:10}MB
spring.servlet.multipart.max-request-size=${MAX_REQUEST_SIZE_MB:20}MB
spring.servlet.multipart.enabled=true

logging.level.root=${LOG_LEVEL_ROOT:INFO}
logging.level.com.app.webia=${LOG_LEVEL_APP:INFO}

spring.jackson.serialization.write-dates-as-timestamps=false
spring.mvc.hiddenmethod.filter.enabled=true
