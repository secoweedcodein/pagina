<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: html(~{::title}, ~{::section})}">
<head><title>Login</title></head>
<body>
<section class="min-h-[70vh] flex items-center justify-center px-4">
    <div class="w-full max-w-md bg-white dark:bg-gray-900 rounded-xl border border-gray-200 dark:border-gray-800 shadow-sm p-6 space-y-4">
        <div class="text-center">
            <h1 class="text-xl font-semibold">Iniciar Sesión</h1>
            <p class="text-sm text-gray-500 dark:text-gray-400">Accede a tu cuenta</p>
        </div>
        <div th:if="${param.error}" class="text-sm text-red-600">Credenciales inválidas</div>
        <div th:if="${param.logout}" class="text-sm text-green-600">Sesión cerrada</div>
        <div th:if="${success}" class="text-sm text-green-600" th:text="${success}"></div>
        <form th:action="@{/auth/login}" method="post" class="space-y-3">
            <div>
                <label class="text-sm">Email</label>
                <input type="email" name="email" required class="mt-1 w-full px-3 py-2 rounded-lg border border-gray-300 dark:border-gray-700 bg-white dark:bg-gray-900 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
            </div>
            <div>
                <label class="text-sm">Contraseña</label>
                <input type="password" name="password" required class="mt-1 w-full px-3 py-2 rounded-lg border border-gray-300 dark:border-gray-700 bg-white dark:bg-gray-900 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
            </div>
            <button type="submit" class="w-full px-3 py-2 rounded-lg bg-indigo-600 text-white text-sm hover:bg-indigo-700">Entrar</button>
        </form>
        <p class="text-sm text-center text-gray-500 dark:text-gray-400">¿No tienes cuenta? <a th:href="@{/auth/register}" class="text-indigo-600 hover:underline">Regístrate</a></p>
    </div>
</section>
</body>
</html>
