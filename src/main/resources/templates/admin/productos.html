<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: html(~{::title}, ~{::section})}">
<head><title>Productos | Administración</title></head>
<body>
<section class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 space-y-6">
    <div class="flex items-center justify-between gap-4">
        <div><h1 class="text-2xl font-semibold">Productos</h1><p class="text-sm text-gray-500">Gestiona el catálogo</p></div>
        <a th:href="@{/admin/productos/nuevo}" class="px-4 py-2 rounded-lg bg-indigo-600 text-white">Nuevo producto</a>
    </div>
    <p th:if="${success}" th:text="${success}" class="text-green-600"></p>
    <p th:if="${error}" th:text="${error}" class="text-red-600"></p>
    <div class="overflow-x-auto rounded-xl border border-gray-200 dark:border-gray-800 bg-white dark:bg-gray-900">
        <table class="w-full text-sm text-left">
            <thead><tr class="border-b dark:border-gray-800"><th class="p-3">Producto</th><th class="p-3">Categoría</th><th class="p-3">Precio</th><th class="p-3">Stock</th><th class="p-3">Acciones</th></tr></thead>
            <tbody>
            <tr th:each="p : ${productos.content}" class="border-b dark:border-gray-800">
                <td class="p-3"><a th:href="@{/producto/{id}(id=${p.id})}" th:text="${p.nombre}" class="font-medium hover:text-indigo-600"></a></td>
                <td class="p-3" th:text="${p.categoria.nombre}"></td>
                <td class="p-3" th:text="${p.precio}"></td>
                <td class="p-3" th:text="${p.stock}"></td>
                <td class="p-3"><form th:action="@{/admin/productos/{id}/eliminar(id=${p.id})}" method="post"><button class="text-red-600 hover:underline" type="submit">Desactivar</button></form></td>
            </tr>
            <tr th:if="${productos.empty}"><td colspan="5" class="p-6 text-center text-gray-500">Todavía no hay productos.</td></tr>
            </tbody>
        </table>
    </div>
</section>
</body>
</html>
