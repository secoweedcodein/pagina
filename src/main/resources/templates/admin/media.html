<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: html(~{::title}, ~{::section})}">
<head><title>Multimedia | Administración</title></head>
<body>
<section class="max-w-3xl mx-auto px-4 sm:px-6 lg:px-8 py-8 space-y-5">
    <h1 class="text-2xl font-semibold">Almacenamiento multimedia</h1>
    <p class="text-sm text-gray-500">Sube un archivo al bucket configurado en Supabase Storage. El enlace público aparecerá al finalizar la carga.</p>
    <form id="mediaUploadForm" action="/api/media/upload" method="post" enctype="multipart/form-data" class="space-y-4 rounded-xl border p-5">
        <label class="block text-sm">Archivo<input type="file" name="file" required class="mt-2 block w-full"></label>
        <button class="rounded-lg bg-indigo-600 px-4 py-2 text-white" type="submit">Subir archivo</button>
        <p id="mediaUploadResult" role="status" class="break-all text-sm"></p>
    </form>
</section>
</body>
</html>
