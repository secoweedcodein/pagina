<div th:fragment="ia-widget" class="fixed bottom-6 right-6 z-50">
    <button id="iaWidgetToggle" class="bg-indigo-600 hover:bg-indigo-700 text-white rounded-full p-4 shadow-lg transition" aria-label="Abrir asistente IA">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 10h.01M12 10h.01M16 10h.01M9 16H5a2 2 0 01-2-2V6a2 2 0 012-2h14a2 2 0 012 2v8a2 2 0 01-2 2h-5l-5 5v-5z"/></svg>
    </button>
    <div id="iaWidgetPanel" class="hidden w-96 h-[520px] bg-white dark:bg-gray-950 rounded-xl shadow-2xl border border-gray-200 dark:border-gray-800 flex flex-col overflow-hidden">
        <div class="px-4 py-3 border-b border-gray-200 dark:border-gray-800 flex items-center justify-between">
            <div class="font-semibold">Asistente IA</div>
            <button id="iaWidgetClose" class="p-1 hover:bg-gray-100 dark:hover:bg-gray-900 rounded">✕</button>
        </div>
        <div class="flex-1 p-4 overflow-y-auto space-y-3" id="iaChatMessages">
            <div class="text-sm text-gray-500 dark:text-gray-400">Hola. ¿En qué te puedo ayudar?</div>
        </div>
        <div class="p-3 border-t border-gray-200 dark:border-gray-800 space-y-2">
            <div class="flex gap-2">
                <input id="iaChatInput" type="text" placeholder="Escribe tu mensaje..." class="flex-1 px-3 py-2 rounded-lg border border-gray-300 dark:border-gray-700 bg-white dark:bg-gray-900 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
                <button id="iaChatSend" class="px-3 py-2 rounded-lg bg-indigo-600 text-white text-sm hover:bg-indigo-700">Enviar</button>
            </div>
            <div class="flex gap-2 text-xs">
                <button class="ia-sug px-2 py-1 rounded border border-gray-300 dark:border-gray-700" data-sug="Genera descripción para producto">Generar desc.</button>
                <button class="ia-sug px-2 py-1 rounded border border-gray-300 dark:border-gray-700" data-sug="Sugiere título SEO">Título SEO</button>
                <button class="ia-sug px-2 py-1 rounded border border-gray-300 dark:border-gray-700" data-sug="Genera ideas de productos">Ideas</button>
            </div>
        </div>
    </div>
</div>
