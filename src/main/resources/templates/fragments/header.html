<header th:fragment="header" class="sticky top-0 z-40 bg-white/80 dark:bg-gray-950/80 backdrop-blur border-b border-gray-200 dark:border-gray-800">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
        <div class="flex justify-between items-center h-16">
            <div class="flex items-center gap-8">
                <a th:href="@{/}" class="flex items-center gap-2">
                    <div class="h-9 w-9 bg-indigo-600 rounded-lg flex items-center justify-center text-white font-bold">W</div>
                    <span class="font-semibold text-lg">WebIA</span>
                </a>
                <nav class="hidden md:flex items-center gap-6">
                    <a th:href="@{/}" class="text-sm hover:text-indigo-600 dark:hover:text-indigo-400 transition">Inicio</a>
                    <a th:href="@{/catalogo}" class="text-sm hover:text-indigo-600 dark:hover:text-indigo-400 transition">Catálogo</a>
                    <a sec:authorize="hasAuthority('ROLE_ADMIN')" th:href="@{/admin}" class="text-sm hover:text-indigo-600 dark:hover:text-indigo-400 transition">Admin</a>
                </nav>
            </div>
            <div class="flex items-center gap-3">
                <form th:action="@{/catalogo}" method="get" class="hidden lg:block">
                    <input type="text" name="q" th:value="${param.q != null ? param.q[0] : ''}" placeholder="Buscar productos..." class="px-3 py-1.5 rounded-lg border border-gray-300 dark:border-gray-700 bg-white dark:bg-gray-900 text-sm w-64 focus:outline-none focus:ring-2 focus:ring-indigo-500">
                </form>
                <button id="themeToggle" class="p-2 rounded-lg hover:bg-gray-100 dark:hover:bg-gray-900 transition" aria-label="Cambiar tema">
                    <svg class="sun-icon h-5 w-5 hidden" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"/></svg>
                    <svg class="moon-icon h-5 w-5" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"/></svg>
                </button>
                <div sec:authorize="isAnonymous()" class="flex items-center gap-2">
                    <a th:href="@{/auth/login}" class="px-3 py-1.5 text-sm rounded-lg border border-gray-300 dark:border-gray-700 hover:bg-gray-50 dark:hover:bg-gray-900 transition">Login</a>
                    <a th:href="@{/auth/register}" class="px-3 py-1.5 text-sm rounded-lg bg-indigo-600 text-white hover:bg-indigo-700 transition">Registro</a>
                </div>
                <div sec:authorize="isAuthenticated()" class="flex items-center gap-2">
                    <a th:href="@{/perfil}" class="px-3 py-1.5 text-sm rounded-lg hover:bg-gray-100 dark:hover:bg-gray-900 transition" sec:authentication="name">Perfil</a>
                    <form th:action="@{/auth/logout}" method="post" class="inline">
                        <button type="submit" class="px-3 py-1.5 text-sm rounded-lg border border-gray-300 dark:border-gray-700 hover:bg-gray-50 dark:hover:bg-gray-900 transition">Salir</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</header>
