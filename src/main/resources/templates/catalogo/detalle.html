<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: html(~{::title}, ~{::section})}">
<head><title>Detalle Producto</title></head>
<body>
<section class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
    <div class="grid md:grid-cols-2 gap-8 bg-white dark:bg-gray-900 rounded-xl border border-gray-200 dark:border-gray-800 overflow-hidden shadow-sm">
        <div>
            <img th:if="${producto.imagenPrincipalUrl}" th:src="${producto.imagenPrincipalUrl}" th:alt="${producto.nombre}" class="w-full h-[420px] object-cover">
            <div th:unless="${producto.imagenPrincipalUrl}" class="w-full h-[420px] bg-gray-100 dark:bg-gray-800 flex items-center justify-center text-gray-400">Sin imagen</div>
        </div>
        <div class="p-6 space-y-4">
            <div>
                <h1 class="text-2xl font-semibold" th:text="${producto.nombre}"></h1>
                <p class="text-sm text-gray-500 dark:text-gray-400" th:text="${producto.categoria.nombre}"></p>
            </div>
            <p class="text-gray-600 dark:text-gray-400 whitespace-pre-line" th:text="${producto.descripcion}"></p>
            <div class="flex items-center gap-4">
                <span class="text-2xl font-bold text-indigo-600" th:text="${producto.precio} + ' €'"></span>
                <span class="text-sm px-2 py-0.5 rounded-full bg-gray-100 dark:bg-gray-800" th:text="'Stock: ' + producto.stock"></span>
            </div>
            <div class="pt-4">
                <a th:href="@{/catalogo}" class="px-5 py-2.5 rounded-lg bg-indigo-600 text-white hover:bg-indigo-700">Seguir comprando</a>
            </div>
        </div>
    </div>
</section>
</body>
</html>
